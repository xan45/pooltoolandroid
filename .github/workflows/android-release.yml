name: Android CI & Automated Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Tag & Version
        id: version
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ -z "$REF_NAME" || "$REF_NAME" == "main" ]]; then
            TAG_NAME="v0.3.0-beta"
          else
            TAG_NAME="$REF_NAME"
          fi
          VERSION_NAME="${TAG_NAME#v}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${COMMIT_COUNT}" >> $GITHUB_ENV
          echo "GIT_COMMIT_HASH=${COMMIT_HASH}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          GIT_COMMIT_HASH: ${{ env.GIT_COMMIT_HASH }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename Release APK Asset
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/OpenPool-${{ env.TAG_NAME }}.apk"

      - name: Generate Release Notes Body
        run: |
          cat << 'EOF' > release_body.md
          ## 🎱 Open Pool Pre-Release ${{ env.TAG_NAME }}

          ### 📦 Asset Information
          * **File**: `OpenPool-${{ env.TAG_NAME }}.apk`
          * **Version Name**: `${{ env.VERSION_NAME }}`
          * **Version Code**: `${{ env.VERSION_CODE }}`
          * **Git Commit**: `${{ env.GIT_COMMIT_HASH }}`
          * **Build Date**: `${{ env.BUILD_DATE }}`

          ---

          ### ✨ What's New & Improvements
          * **Realistic Audio Engine**: High-fidelity acoustic billiard sound effects (`.ogg`) powered by Android's native `SoundPool` with dynamic velocity volume scaling and pitch variations.
          * **Advanced Cue Ball Spin & English**: Full cue tip offset controls to execute Follow (top spin), Draw (backspin), and Left/Right English with squirt deflection and rail rebound angle shifts.
          * **Interactive Spin Selector UI**: Interactive 2D cue ball chalk contact selector with real-time spin readouts and center stun preset.
          * **Realistic Cushion Jaws & Angle Acceptance**: 12 tapered pocket jaw chamfers with angle-aware pocket acceptance cones; shallow skimming shots bank or rattle rather than being magnetically pocketed.
          * **Direct Android Studio Detection**: Seamless root-level and android-level Gradle project workspace.
          * **Material 3 UI**: Floating glassmorphism HUD cards, elevated rounded buttons, press-scale animations.
          * **3D Cue Customization**: 5 customizable cue sticks (*Classic Wood, Ebony, Carbon Fiber, Gold, Neon Blue*).
          * **3D Table & Cushions**: Dark green tournament cloth (`#0B5D3B`), 6 tapered cushions (`#094B30`), 3D recessed pockets.
          * **Touch Controls**: 50% reduced sensitivity, LERP touch smoothing, raycast collision crosshair indicator ring.

          ---
          **Developer**: Abhinav Kishore (XanDron45)  
          *Generated automatically by GitHub CI/CD Actions*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Open Pool ${{ env.TAG_NAME }}
          body_path: release_body.md
          prerelease: true
          draft: false
          files: artifacts/OpenPool-${{ env.TAG_NAME }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
